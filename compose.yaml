name: xiaoying
services:
  mysql:
    image: mysql:8.4.8
    environment:
      MYSQL_DATABASE: xiaoying
      MYSQL_USER: xiaoying
      MYSQL_PASSWORD: ${DB_PASSWORD:-local-demo-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-password}
      TZ: UTC
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'mysqladmin ping -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
  backend:
    build:
      context: ./backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/xiaoying?connectionTimeZone=UTC
      DB_USERNAME: xiaoying
      DB_PASSWORD: ${DB_PASSWORD:-local-demo-password}
      STORAGE_DIR: /data
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SPRING_PROFILES_ACTIVE: demo
      WORKER_QUEUE_CAPACITY: 20
      TZ: UTC
    volumes:
      - media-data:/data
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'curl --fail --silent http://localhost:8080/api/ping || exit 1']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
    environment:
      BACKEND_URL: http://backend:8080
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - '${FRONTEND_PORT:-3000}:3000'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://127.0.0.1:3000/").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
volumes:
  mysql-data:
  media-data:

