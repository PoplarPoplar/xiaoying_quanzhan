name: verify
on: [push, pull_request]
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test -- --run
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.8
        env:
          MYSQL_DATABASE: xiaoying_test
          MYSQL_ROOT_PASSWORD: test-password
        ports: [3306:3306]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest-password --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/xiaoying_test?connectionTimeZone=UTC
      DB_USERNAME: root
      DB_PASSWORD: test-password
      APP_ORIGIN: http://localhost:3000
      SPRING_PROFILES_ACTIVE: demo
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: chmod +x mvnw && ./mvnw -B verify
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 240
      - run: node scripts/smoke.mjs http://localhost:3000
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down
